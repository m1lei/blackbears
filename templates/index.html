<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackbears — аудиозаписи</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #222;
        }
        h1 { font-size: 1.5rem; }
        form {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 1rem;
        }
        input[type="file"] { flex: 1; }
        button {
            padding: 0.5rem 1.25rem;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        button:disabled { background: #93c5fd; cursor: not-allowed; }
        #message {
            margin-bottom: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            display: none;
        }
        #message.success { display: block; background: #dcfce7; color: #166534; }
        #message.error { display: block; background: #fee2e2; color: #991b1b; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid #e5e7eb;
        }
        th { background: #f9fafb; font-weight: 600; }
        .empty { color: #6b7280; font-style: italic; }
    </style>
</head>
<body>
    <h1>Загрузка аудиозаписей</h1>

    <form id="upload-form">
        <input type="file" id="file-input" accept=".wav,.mp3" required>
        <button type="submit" id="submit-btn">Загрузить</button>
    </form>

    <div id="message"></div>

    <h2>Загруженные записи</h2>
    {% if recordings %}
    <table>
        <thead>
            <tr>
                <th>Файл</th>
                <th>Размер</th>
                <th>Дата</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody>
            {% for r in recordings %}
            <tr>
                <td>{{ r.original_filename }}</td>
                <td>{{ r.file_size }}</td>
                <td>{{ r.created_at }}</td>
                <td>{{ r.status }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="empty">Пока нет ни одной записи.</p>
    {% endif %}

    <script>
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('file-input');
        const submitBtn = document.getElementById('submit-btn');
        const message = document.getElementById('message');

        function showMessage(text, kind) {
            message.textContent = text;
            message.className = kind;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            message.className = '';
            message.textContent = '';
            submitBtn.disabled = true;
            try {
                const response = await fetch('/recordings', {
                    method: 'POST',
                    body: (() => {
                        const data = new FormData();
                        data.append('file', fileInput.files[0]);
                        return data;
                    })(),
                });
                const body = await response.json();
                if (response.ok) {
                    showMessage(`Файл «${body.original_filename}» загружен`, 'success');
                    setTimeout(() => window.location.reload(), 800);
                } else {
                    showMessage(`Ошибка: ${body.detail}`, 'error');
                }
            } catch (err) {
                showMessage('Ошибка сети: не удалось отправить файл', 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
